name: Build Synthia Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android 36 build tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.14.2'

      - name: Verify native plugin sources are present
        run: node utils/synthia_release_audit.mjs

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Synthia and editor source
        run: |
          npm run test:synthia-complete
          npm test
          npm run typecheck

      - name: Restore native Acode and Cordova components
        run: npx --no-install cordova platform add android --nosave

      - name: Check Android build requirements
        run: npx --no-install cordova requirements android

      - name: Build installable debug APK
        # "paid" is Acode's inherited ad-free build variant; it requires no payment.
        run: npm run build -- paid dev apk

      - name: Verify APK signature and package
        run: |
          apk=platforms/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > apk-badging.txt
          grep -q "package: name='world.synthia.acode'" apk-badging.txt
          mkdir -p apk-download
          cp "$apk" apk-download/Synthia-OS-debug.apk
          cp apk-badging.txt apk-download/
          (cd apk-download && sha256sum Synthia-OS-debug.apk > SHA256SUMS.txt)
          {
            echo '### Synthia OS APK built successfully'
            echo 'Download **Synthia-OS-debug-APK** from this run’s artifacts.'
            echo 'This APK includes the Acode foundation and needs no separate Acode or Cordova installation.'
            echo 'It uses a development signing key; physical-device acceptance is still required.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Synthia-OS-debug-APK
          path: apk-download/
          if-no-files-found: error
          retention-days: 30
